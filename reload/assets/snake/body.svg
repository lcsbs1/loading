<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Modular Body Segment with Chamfered Corners -->
  <defs>
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Octagonal Chamfered Chassis -->
  <polygon points="12,6 36,6 42,12 42,36 36,42 12,42 6,36 6,12" fill="#030A10" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" filter="url(#core-glow)" />
  <!-- Internal Energy Battery Node -->
  <rect x="18" y="18" width="12" height="12" fill="#00F0FF" opacity="0.85" rx="1" />
  <!-- Connecting circuit lines -->
  <line x1="24" y1="6" x2="24" y2="12" stroke="#E6EDF3" stroke-width="1" stroke-opacity="0.5" />
  <line x1="24" y1="36" x2="24" y2="42" stroke="#E6EDF3" stroke-width="1" stroke-opacity="0.5" />
</svg>
