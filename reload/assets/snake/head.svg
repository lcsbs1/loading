<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- HUD Cyber-Minimalist Snake Head -->
  <defs>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Main Chamfered Hull (Aerospace 45° cut) -->
  <polygon points="6,8 34,8 42,16 42,40 6,40" fill="#040D14" stroke="#00F0FF" stroke-width="1.75" filter="url(#cyan-glow)" />
  <!-- Cyber Visor / Core -->
  <polygon points="12,14 30,14 36,20 36,24 12,24" fill="#00F0FF" opacity="0.9" />
  <!-- HUD Target Reticle Marks -->
  <line x1="24" y1="4" x2="24" y2="8" stroke="#E6EDF3" stroke-width="1.5" />
  <line x1="42" y1="28" x2="46" y2="28" stroke="#E6EDF3" stroke-width="1.5" />
  <circle cx="24" cy="32" r="2.5" fill="#00F0FF" />
</svg>
