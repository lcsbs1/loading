<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Data Orb / Pulsing Energy Cube -->
  <defs>
    <filter id="orb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Rotating Containment Diamond -->
  <polygon points="24,4 44,24 24,44 4,24" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.85" />
  <!-- Energy Core Cube -->
  <rect x="16" y="16" width="16" height="16" fill="#00F0FF" transform="rotate(45 24 24)" filter="url(#orb-glow)" />
  <!-- Quantum Core Point -->
  <circle cx="24" cy="24" r="3" fill="#E6EDF3" />
</svg>
